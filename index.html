<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VidTube — Video Gallery</title>
<style>
  /* ============ THEME TOKENS ============ */
  :root{
    --bg:#0f0f0f;
    --bg-elev:#181818;
    --bg-hover:#272727;
    --text:#f1f1f1;
    --text-dim:#aaaaaa;
    --border:#303030;
    --brand:#ff0033;
    --chip-bg:#272727;
    --chip-active-bg:#f1f1f1;
    --chip-active-text:#0f0f0f;
    --skeleton:#222;
    --header-h:56px;
    --sidebar-w:240px;
    --shadow:0 4px 32px rgba(0,0,0,.6);
  }
  html[data-theme="light"]{
    --bg:#ffffff;
    --bg-elev:#f9f9f9;
    --bg-hover:#e5e5e5;
    --text:#0f0f0f;
    --text-dim:#606060;
    --border:#e5e5e5;
    --chip-bg:#f2f2f2;
    --chip-active-bg:#0f0f0f;
    --chip-active-text:#ffffff;
    --skeleton:#eee;
    --shadow:0 4px 32px rgba(0,0,0,.25);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Roboto","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body.no-scroll{overflow:hidden;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  img{display:block;max-width:100%;}

  /* ============ HEADER ============ */
  .masthead{
    position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:60;
    display:flex;align-items:center;gap:8px;
    padding:0 16px;background:var(--bg);
  }
  .mast-start{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
  .mast-end{display:flex;align-items:center;gap:4px;flex:1;justify-content:flex-end;}
  .mast-mid{display:flex;align-items:center;gap:8px;flex:0 1 640px;}

  .icon-btn{
    width:40px;height:40px;border-radius:50%;
    display:grid;place-items:center;flex:none;
    transition:background .15s;
  }
  .icon-btn:hover{background:var(--bg-hover);}
  .icon-btn svg{width:24px;height:24px;fill:currentColor;}

  .logo{display:flex;align-items:center;gap:5px;font-size:20px;font-weight:700;letter-spacing:-1px;}
  .logo .play{
    width:29px;height:20px;background:var(--brand);border-radius:6px;
    display:grid;place-items:center;flex:none;
  }
  .logo .play::after{content:"";border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px;}

  .search-form{display:flex;flex:1;min-width:0;}
  .search-box{
    flex:1;min-width:0;display:flex;align-items:center;
    border:1px solid var(--border);border-right:0;
    border-radius:20px 0 0 20px;background:rgba(0,0,0,.15);
    padding:0 4px 0 16px;height:40px;
  }
  html[data-theme="light"] .search-box{background:#fff;}
  .search-box:focus-within{border-color:#3ea6ff;}
  .search-box input{
    flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;
    color:var(--text);font-size:16px;
  }
  .search-box input::placeholder{color:var(--text-dim);}
  .search-btn{
    width:64px;height:40px;flex:none;
    border:1px solid var(--border);border-radius:0 20px 20px 0;
    background:var(--bg-hover);display:grid;place-items:center;
  }
  .search-btn svg{width:22px;height:22px;fill:currentColor;}

  .avatar{
    width:32px;height:32px;border-radius:50%;flex:none;
    background:linear-gradient(135deg,#ff0033,#ff8a00);
    display:grid;place-items:center;font-size:14px;font-weight:600;color:#fff;
    margin-left:8px;
  }

  /* ============ LAYOUT ============ */
  .layout{display:flex;padding-top:var(--header-h);}

  .sidebar{
    position:fixed;top:var(--header-h);bottom:0;left:0;width:var(--sidebar-w);
    background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
    padding:12px;z-index:50;
    transition:transform .2s ease;
    scrollbar-width:thin;scrollbar-color:var(--border) transparent;
  }
  .sidebar::-webkit-scrollbar{width:8px;}
  .sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
  .sidebar.collapsed{transform:translateX(-100%);}
  .side-group{padding:8px 0;border-bottom:1px solid var(--border);}
  .side-group:last-child{border-bottom:0;}
  .side-title{font-size:14px;font-weight:500;color:var(--text-dim);padding:8px 12px;}
  .side-link{
    display:flex;align-items:center;gap:24px;
    padding:0 12px;height:40px;border-radius:10px;font-size:14px;
  }
  .side-link svg{width:22px;height:22px;fill:currentColor;flex:none;}
  .side-link:hover{background:var(--bg-hover);}
  .side-link.active{background:var(--bg-hover);font-weight:500;}

  .scrim{
    position:fixed;inset:var(--header-h) 0 0 0;background:rgba(0,0,0,.5);
    z-index:45;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .scrim.show{opacity:1;pointer-events:auto;}

  .content{
    flex:1;min-width:0;margin-left:var(--sidebar-w);
    transition:margin-left .2s ease;
  }
  .content.wide{margin-left:0;}

  /* ============ CHIPS ============ */
  .chipbar{
    position:sticky;top:var(--header-h);z-index:30;background:var(--bg);
    display:flex;gap:12px;overflow-x:auto;padding:12px 24px;
    scrollbar-width:none;
  }
  .chipbar::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;padding:0 12px;height:32px;line-height:32px;
    background:var(--chip-bg);border-radius:8px;font-size:14px;white-space:nowrap;
  }
  .chip:hover{background:var(--bg-hover);}
  .chip.active{background:var(--chip-active-bg);color:var(--chip-active-text);}

  /* ============ VIDEO GRID ============ */
  .grid{
    display:grid;gap:40px 16px;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    padding:8px 24px 60px;
  }

  .card{cursor:pointer;display:flex;flex-direction:column;}
  .card:focus-visible{outline:2px solid #3ea6ff;outline-offset:4px;border-radius:12px;}
  .thumb-wrap{
    position:relative;width:100%;aspect-ratio:16/9;
    border-radius:12px;overflow:hidden;background:var(--skeleton);
  }
  .thumb-wrap img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .35s ease;
  }
  .card:hover .thumb-wrap img{transform:scale(1.05);}
  .duration{
    position:absolute;right:8px;bottom:8px;
    background:rgba(0,0,0,.8);color:#fff;
    font-size:12px;font-weight:500;padding:1px 4px;border-radius:4px;
  }
  .play-overlay{
    position:absolute;inset:0;display:grid;place-items:center;
    background:rgba(0,0,0,.25);opacity:0;transition:opacity .2s;
  }
  .card:hover .play-overlay{opacity:1;}
  .play-overlay span{
    width:52px;height:52px;border-radius:50%;background:var(--brand);
    display:grid;place-items:center;
  }
  .play-overlay span::after{
    content:"";border-left:16px solid #fff;
    border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px;
  }

  .meta{display:flex;gap:12px;padding-top:12px;}
  .ch-avatar{
    width:36px;height:36px;border-radius:50%;flex:none;object-fit:cover;
    background:var(--bg-hover);
  }
  .meta-text{min-width:0;flex:1;}
  .title{
    font-size:16px;font-weight:500;line-height:1.4;margin:0 0 4px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .channel,.stats{font-size:14px;color:var(--text-dim);line-height:1.4;}

  .empty{
    grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--text-dim);
  }
  .empty strong{display:block;font-size:18px;color:var(--text);margin-bottom:6px;}

  /* ============ PLAYER MODAL ============ */
  .modal{
    position:fixed;inset:0;z-index:100;
    display:none;align-items:center;justify-content:center;padding:24px;
    background:rgba(0,0,0,.9);
  }
  .modal.open{display:flex;}
  .modal-inner{width:min(1100px,100%);}
  .player{
    position:relative;width:100%;aspect-ratio:16/9;
    background:#000;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);
  }
  .player iframe,.player video{width:100%;height:100%;border:0;display:block;}
  .modal-bar{
    display:flex;align-items:flex-start;gap:12px;
    padding:16px 4px 0;color:#f1f1f1;
  }
  .modal-bar h2{font-size:18px;margin:0 0 4px;font-weight:500;}
  .modal-bar p{margin:0;font-size:14px;color:#aaa;}
  .modal-actions{display:flex;gap:8px;flex:none;margin-left:auto;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    height:36px;padding:0 16px;border-radius:18px;
    background:rgba(255,255,255,.15);color:#fff;font-size:14px;font-weight:500;white-space:nowrap;
  }
  .pill:hover{background:rgba(255,255,255,.28);}
  .pill svg{width:18px;height:18px;fill:currentColor;}
  .close-x{
    position:absolute;top:12px;right:16px;z-index:110;
    width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;
    display:grid;place-items:center;
  }
  .close-x:hover{background:rgba(255,255,255,.2);}
  .close-x svg{width:24px;height:24px;fill:currentColor;}

  /* ============ RESPONSIVE ============ */
  @media (max-width:1312px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}
  }
  /* ট্যাবলেট: সাইডবার push না করে overlay হবে */
  @media (max-width:1100px){
    .sidebar{transform:translateX(-100%);box-shadow:var(--shadow);}
    .sidebar.open{transform:translateX(0);}
    .content{margin-left:0;}
  }
  @media (max-width:900px){
    .grid{gap:28px 16px;padding:8px 16px 60px;}
    .chipbar{padding:12px 16px;}
  }
  @media (min-width:761px){
    .search-toggle{display:none;}
    .mobile-back{display:none;}
  }
  @media (max-width:760px){
    .masthead{padding:0 8px;}
    .mast-mid{
      position:absolute;left:0;right:0;top:0;height:var(--header-h);
      padding:8px;background:var(--bg);display:none;z-index:70;
    }
    .mast-mid.show{display:flex;}
    .logo{font-size:18px;}
  }
  /* ফোন: এক কলাম, YouTube অ্যাপের মতো edge-to-edge thumbnail */
  @media (max-width:600px){
    .grid{grid-template-columns:1fr;gap:24px;padding:4px 0 72px;}
    .thumb-wrap{border-radius:0;}
    .meta{padding:12px 12px 0;}
    .title{font-size:15px;}
    .channel,.stats{font-size:13px;}
    .modal{padding:0;}
    .modal-inner{width:100%;}
    .player{border-radius:0;}
    .modal-bar{flex-direction:column;padding:16px 16px 0;}
    .modal-actions{margin-left:0;width:100%;}
    .pill{flex:1;justify-content:center;}
  }
</style>
</head>

  <div class="scrim" id="scrim"></div>

  <div class="content" id="content">
    <div class="chipbar" id="chipbar"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- ============ PLAYER MODAL ============ -->
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <button class="close-x" id="closeBtn" aria-label="Close">
    <svg viewBox="0 0 24 24"><path d="M13.06 12l6.47-6.47-1.06-1.06L12 10.94 5.53 4.47 4.47 5.53 10.94 12l-6.47 6.47 1.06 1.06L12 13.06l6.47 6.47 1.06-1.06L13.06 12z"/></svg>
  </button>
  <div class="modal-inner">
    <div class="player" id="player"></div>
    <div class="modal-bar">
      <div>
        <h2 id="modalTitle"></h2>
        <p id="modalMeta"></p>
      </div>
      <div class="modal-actions">
        <a class="pill" id="openLink" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7zM19 19H5V5h6V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-6h-2v6z"/></svg>
          Open original
        </a>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   লিংক পার্স — YouTube / Vimeo / সরাসরি MP4 / অন্য কিছু
   ============================================================ */
function parseVideo(url){
  if(!url) return {type:"none"};
  const u = String(url).trim();

  // YouTube: watch?v= | youtu.be/ | /embed/ | /shorts/ | /live/
  const yt = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if(yt) return {type:"youtube", id:yt[1], src:u};

  // Vimeo
  const vm = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(vm) return {type:"vimeo", id:vm[1], src:u};

  // সরাসরি ভিডিও ফাইল
  if(/\.(mp4|webm|ogg|ogv|mov|m4v)(\?.*)?$/i.test(u)) return {type:"file", src:u};

  // এম্বেড করা যাবে না → নতুন ট্যাবে খুলবে
  return {type:"link", src:u};
}

/* image না দিলে লিংক থেকে thumbnail অটো বের করা */
function thumbFor(v){
  if(v.image) return v.image;
  const p = parseVideo(v.video);
  if(p.type === "youtube") return "https://i.ytimg.com/vi/" + p.id + "/hqdefault.jpg";
  if(p.type === "vimeo")   return "https://vumbnail.com/" + p.id + ".jpg";
  return "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><rect width="320" height="180" fill="#303030"/><polygon points="140,64 140,116 186,90" fill="#8a8a8a"/></svg>'
  );
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ============================================================
   কার্ড রেন্ডার
   ============================================================ */
const grid = document.getElementById("grid");

function render(list){
  grid.innerHTML = "";

  if(!list.length){
    grid.innerHTML = '<div class="empty"><strong>কোনো ভিডিও পাওয়া যায়নি</strong>অন্য কিছু দিয়ে খুঁজে দেখুন।</div>';
    return;
  }

  list.forEach(function(v){
    const card = document.createElement("div");
    card.className = "card";
    card.tabIndex = 0;
    card.setAttribute("role", "button");

    const avatarHTML = v.avatar
      ? '<img class="ch-avatar" src="' + esc(v.avatar) + '" alt="" loading="lazy">'
      : '<div class="ch-avatar" style="display:grid;place-items:center;font-size:14px;font-weight:600;background:linear-gradient(135deg,#ff0033,#ff8a00);color:#fff">'
        + esc((v.channel || "?").trim().charAt(0).toUpperCase()) + '</div>';

    card.innerHTML =
      '<div class="thumb-wrap">' +
        '<img src="' + esc(thumbFor(v)) + '" alt="' + esc(v.title) + '" loading="lazy">' +
        (v.duration ? '<span class="duration">' + esc(v.duration) + '</span>' : '') +
        '<div class="play-overlay"><span></span></div>' +
      '</div>' +
      '<div class="meta">' +
        avatarHTML +
        '<div class="meta-text">' +
          '<h3 class="title">' + esc(v.title || "Untitled") + '</h3>' +
          '<div class="channel">' + esc(v.channel) + '</div>' +
          '<div class="stats">' + esc([v.views, v.date].filter(Boolean).join(" • ")) + '</div>' +
        '</div>' +
      '</div>';

    card.addEventListener("click", function(){ openVideo(v); });
    card.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openVideo(v); }
    });

    grid.appendChild(card);
  });
}

/* ============================================================
   প্লেয়ার — মডালে চলবে, এম্বেড না হলে নতুন ট্যাবে
   ============================================================ */
const modal      = document.getElementById("modal");
const player     = document.getElementById("player");
const modalTitle = document.getElementById("modalTitle");
const modalMeta  = document.getElementById("modalMeta");
const openLink   = document.getElementById("openLink");

function openVideo(v){
  const p = parseVideo(v.video);

  if(p.type === "none") return;

  if(p.type === "link"){
    window.open(p.src, "_blank", "noopener");
    return;
  }

  if(p.type === "youtube"){
    player.innerHTML =
      '<iframe src="https://www.youtube-nocookie.com/embed/' + p.id + '?autoplay=1&rel=0" ' +
      'title="' + esc(v.title) + '" allowfullscreen ' +
      'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>';
  }else if(p.type === "vimeo"){
    player.innerHTML =
      '<iframe src="https://player.vimeo.com/video/' + p.id + '?autoplay=1" ' +
      'title="' + esc(v.title) + '" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>';
  }else{
    player.innerHTML =
      '<video src="' + esc(p.src) + '" poster="' + esc(thumbFor(v)) + '" controls autoplay playsinline></video>';
  }

  modalTitle.textContent = v.title || "";
  modalMeta.textContent  = [v.channel, v.views, v.date].filter(Boolean).join(" • ");
  openLink.href = v.video;

  modal.classList.add("open");
  document.body.classList.add("no-scroll");
}

function closeVideo(){
  modal.classList.remove("open");
  player.innerHTML = "";                       // প্লেব্যাক থামানোর জন্য
  document.body.classList.remove("no-scroll");
}

document.getElementById("closeBtn").addEventListener("click", closeVideo);
modal.addEventListener("click", function(e){ if(e.target === modal) closeVideo(); });
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && modal.classList.contains("open")) closeVideo();
});

/* ============================================================
   ফিল্টার চিপ + সার্চ
   ============================================================ */
const chipbar = document.getElementById("chipbar");
const tags = ["All"].concat(Array.from(new Set(VIDEOS.map(function(v){ return v.tag; }).filter(Boolean))));
let activeTag = "All";
let query = "";

tags.forEach(function(t){
  const b = document.createElement("button");
  b.className = "chip" + (t === "All" ? " active" : "");
  b.textContent = t;
  b.addEventListener("click", function(){
    activeTag = t;
    chipbar.querySelectorAll(".chip").forEach(function(c){ c.classList.toggle("active", c === b); });
    apply();
  });
  chipbar.appendChild(b);
});

function apply(){
  const q = query.trim().toLowerCase();
  render(VIDEOS.filter(function(v){
    const tagOk = activeTag === "All" || v.tag === activeTag;
    const hay = [v.title, v.channel, v.tag].filter(Boolean).join(" ").toLowerCase();
    return tagOk && (!q || hay.indexOf(q) !== -1);
  }));
}

document.getElementById("searchForm").addEventListener("submit", function(e){ e.preventDefault(); });
document.getElementById("searchInput").addEventListener("input", function(e){
  query = e.target.value;
  apply();
});

/* ============================================================
   সাইডবার — বড় স্ক্রিনে push, ছোট স্ক্রিনে overlay
   ============================================================ */
const sidebar = document.getElementById("sidebar");
const content = document.getElementById("content");
const scrim   = document.getElementById("scrim");

document.getElementById("menuBtn").addEventListener("click", function(){
  if(window.innerWidth <= 1100){
    const open = sidebar.classList.toggle("open");
    scrim.classList.toggle("show", open);
    document.body.classList.toggle("no-scroll", open);
  }else{
    const collapsed = sidebar.classList.toggle("collapsed");
    content.classList.toggle("wide", collapsed);
  }
});

scrim.addEventListener("click", function(){
  sidebar.classList.remove("open");
  scrim.classList.remove("show");
  document.body.classList.remove("no-scroll");
});

window.addEventListener("resize", function(){
  if(window.innerWidth > 1100){
    sidebar.classList.remove("open");
    scrim.classList.remove("show");
    if(!modal.classList.contains("open")) document.body.classList.remove("no-scroll");
  }else{
    sidebar.classList.remove("collapsed");
    content.classList.remove("wide");
  }
});

/* ============ মোবাইল সার্চ ============ */
const searchWrap = document.getElementById("searchWrap");
document.getElementById("searchToggle").addEventListener("click", function(){
  searchWrap.classList.add("show");
  document.getElementById("searchInput").focus();
});
document.getElementById("searchBack").addEventListener("click", function(){
  searchWrap.classList.remove("show");
});

/* ============ থিম (ডার্ক / লাইট) ============ */
const MOON = '<path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36A5.39 5.39 0 0116 13a5.4 5.4 0 01-5.4-5.4c0-1.81.89-3.41 2.26-4.4-.28-.13-.57-.2-.86-.2z"/>';
const SUN  = '<circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>';

function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("themeIcon").innerHTML = (t === "light" ? SUN : MOON);
  try{ localStorage.setItem("vidtube-theme", t); }catch(e){}
}

document.getElementById("themeBtn").addEventListener("click", function(){
  setTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
});

let savedTheme = null;
try{ savedTheme = localStorage.getItem("vidtube-theme"); }catch(e){}
setTheme(savedTheme || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));

/* ============ শুরু ============ */
apply();
</script>
</body>
</html>
